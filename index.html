<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Lista de Preços Skyline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="skyline-auth.js?v=1"></script>
  <style>
    :root {
      --bg: #4b2e83;
      --card: #ffffff;
      --text: #2d1f42;
      --muted: #6b5b7a;
      --accent: #c4a8e8;
      --line: rgba(45, 31, 66, 0.12);
      --font-display: "Orbitron", sans-serif;
      --font-body: "Exo 2", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(196, 168, 232, 0.35), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(255, 255, 255, 0.12), transparent 50%),
        var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 26px 24px;
      box-shadow: 0 18px 50px rgba(45, 31, 66, 0.28);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand img {
      height: 36px;
      width: auto;
      display: inline-block;
    }

    h1 {
      margin: 14px 0 6px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .field { margin-bottom: 14px; }

    input {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 0 12px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: #8b6bb8;
      box-shadow: 0 0 0 3px rgba(139, 107, 184, 0.2);
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #4b2e83, #8b6bb8);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .error {
      display: none;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 0.84rem;
    }

    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/skyline-logo-wordmark.png" alt="Skyline mobile" width="120" height="38" />
      <h1>Lista de Preços</h1>
      <p class="sub">Entre com e-mail e senha para consultar</p>
    </div>

    <div class="error" id="errorBox"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="voce@empresa.com" />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" id="btnLogin">Entrar</button>
    </form>
  </div>

  <script>
    (function () {
      const session = SkylineAuth.getSession();
      const params = new URLSearchParams(location.search);
      const nextRaw = params.get("next") || "lista-precos.html";
      const next = /^lista-precos\.html(\?.*)?(#.*)?$/i.test(nextRaw) ? nextRaw : "lista-precos.html";

      if (session) {
        location.replace(next);
        return;
      }

      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("errorBox");
      const btn = document.getElementById("btnLogin");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.remove("show");
        btn.disabled = true;
        btn.textContent = "Entrando…";
        try {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const res = await SkylineAuth.login(email, password);
          if (!res.ok) {
            errorBox.textContent = res.error || "Falha no login.";
            errorBox.classList.add("show");
            return;
          }
          location.replace(next);
        } catch (err) {
          errorBox.textContent = err.message || "Erro inesperado.";
          errorBox.classList.add("show");
        } finally {
          btn.disabled = false;
          btn.textContent = "Entrar";
        }
      });
    })();
  </script>
</body>
</html>
